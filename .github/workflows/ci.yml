name: CI

on:
  push:
    branches: [main]
  pull_request:

# Un push nuevo a la misma rama/PR cancela la ejecución anterior.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: Lint, tipos, tests y build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      # La URL de la API (API_URL) es de runtime (DX-083) y el build no la
      # necesita. NEXT_PUBLIC_ROOT_DOMAIN sí se incrusta en el bundle: así el
      # build de CI no depende del default del código.
      NEXT_PUBLIC_ROOT_DOMAIN: dentalix.local
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      # Avisos de seguridad en dependencias de producción (DX-080): falla con
      # cualquier aviso alto o crítico.
      - name: Auditar dependencias de producción
        run: npm audit --omit=dev --audit-level=high
      # `npm run lint` es `eslint` a secas (sin --fix): sirve tal cual en CI.
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npx jest --ci
      - run: npm run build

  # DX-495 (TST-062): fronteras de calendario. El cambio de mes del 31-10 al
  # 01-11 dejó en rojo `expenses-summary-view` (DX-466) y ningún job corría el
  # Jest con la hora en una frontera. Este lo corre con el reloj de jest
  # fijado (FAKE_NOW, en proceso: `jest.calendar-clock.ts`) a:
  #   - fin-de-mes:      el último día 31 ya empezado, 23:59:30 UTC (sin diciembre);
  #   - medianoche-sede: el día 1 del mes en curso, 05:01 UTC (00:01 en Bogotá);
  #   - fin-de-anio:     el 31 de diciembre más cercano, 23:59:30 UTC.
  # Las fechas salen de `calendarBoundary` (src/lib/test/calendar-clock.ts),
  # igual que en el job del mismo nombre de la API. El reloj arranca en esa
  # hora en cada fichero de test y avanza; los tests que fijan el suyo
  # (`jest.useFakeTimers` + `setSystemTime`) no cambian.
  calendar-boundaries:
    name: Fronteras de calendario (${{ matrix.boundary }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        boundary: [fin-de-mes, medianoche-sede, fin-de-anio]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - name: Jest con FAKE_NOW=${{ matrix.boundary }}
        env:
          FAKE_NOW: ${{ matrix.boundary }}
          TZ: UTC
        run: npx jest --ci

  # DX-083: la imagen de producción (Dockerfile, `output: 'standalone'`) se
  # construye UNA vez en cada PR, sin publicarla, y la prueba de humo la
  # arranca contra dos APIs (falsas) distintas cambiando solo API_URL y
  # FILES_ORIGIN: el proxy /api/v1 llega a cada una, el origen de la URL
  # `inline` de un documento está en la CSP servida, y sin API_URL no arranca.
  docker-image:
    name: Imagen Docker (build y humo con dos APIs)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      # node del runner: solo para las APIs falsas de la prueba de humo.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: docker build (sin publicar)
        run: docker build --build-arg NEXT_PUBLIC_ROOT_DOMAIN=dentalix.app -t dentalix-web:ci .
      - name: Sin .env y sin root en la imagen
        run: |
          docker run --rm dentalix-web:ci sh -c '
            test "$(id -u)" != 0 && ! ls -a /app | grep -q "^\.env" && test -f server.js'
      - name: Prueba de humo con dos URLs de API
        run: scripts/docker-smoke/web.sh dentalix-web:ci
