name: Fronteras de calendario

# DX-495 (TST-062): el cambio de mes del 31-10 al 01-11 dejó en rojo
# `expenses-summary-view` (DX-466) y ningún job corría el Jest con la hora en
# una frontera. Este lo corre con el reloj de jest fijado (FAKE_NOW, en
# proceso: `jest.calendar-clock.ts`), en el mes en curso, a:
#   - fin-de-mes:      el último día del mes (el 31 si lo tiene), 23:59:30 UTC;
#   - medianoche-sede: el día 1, 04:01 UTC (00:01 en Caracas, UTC−4);
#   - fin-de-anio:     el 31 de diciembre, 23:59:30 UTC.
# Las fechas salen de `calendarBoundary` (src/lib/test/calendar-clock.ts),
# igual que en el workflow del mismo nombre de la API. El reloj arranca en esa
# hora en cada fichero de test y avanza; los tests que fijan el suyo
# (`jest.useFakeTimers` + `setSystemTime`) no cambian.
#
# Cuándo corre: lo mismo que en la API. Lo que encuentra depende de la fecha,
# no del PR, así que no se suma a cada PR (tres runners más con `npm ci` y el
# Jest entero): corre en cada push a main, a diario, a mano y en los PR que
# tocan el propio reloj o este workflow.
on:
  push:
    branches: [main]
  pull_request:
    paths:
      - .github/workflows/calendar-boundaries.yml
      - src/lib/test/calendar-clock.ts
      - jest.calendar-clock.ts
      - jest.config.ts
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

concurrency:
  group: calendar-boundaries-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  calendar-boundaries:
    name: Fronteras de calendario (${{ matrix.boundary }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        boundary: [fin-de-mes, medianoche-sede, fin-de-anio]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      # DX-297: parte del Jest resuelve colores y axe en Chromium real; como en
      # ci.yml, los navegadores se cachean por la versión exacta de
      # @playwright/test y el SO, y la instalación reintenta hasta 3 veces.
      - name: Versión de Playwright y SO (clave de la caché de navegadores)
        id: playwright-version
        timeout-minutes: 1
        run: |
          version="$(node -p "require('./package-lock.json').packages['node_modules/@playwright/test']?.version ?? ''")"
          if ! [[ "${version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+ ]]; then
            echo "::error title=Versión de Playwright::package-lock.json no tiene node_modules/@playwright/test con una versión exacta (es «${version}»)"
            exit 1
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "os=$(. /etc/os-release && echo "${ID}-${VERSION_ID}")-$(uname -m)" >> "$GITHUB_OUTPUT"
      - name: Navegadores de Playwright (restaurar la caché)
        id: playwright-cache
        timeout-minutes: 2
        uses: actions/cache/restore@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ steps.playwright-version.outputs.os }}-${{ steps.playwright-version.outputs.version }}
      - name: Instalar Chromium para las pruebas de contraste
        timeout-minutes: 10
        env:
          BROWSERS_CACHED: ${{ steps.playwright-cache.outputs.cache-hit }}
        run: |
          echo 'Acquire::Retries "3";' | sudo tee /etc/apt/apt.conf.d/80-dentalix-retries >/dev/null
          if [[ "${BROWSERS_CACHED}" == "true" ]]; then
            install=(install-deps chromium)
          else
            install=(install --with-deps chromium)
          fi
          for attempt in 1 2 3; do
            if npx playwright "${install[@]}"; then
              exit 0
            fi
            if [[ "${attempt}" -lt 3 ]]; then
              echo "::warning title=Chromium de Playwright::intento ${attempt} de 3 fallido (playwright ${install[*]}); reintento"
              sleep $((attempt * 15))
            fi
          done
          echo "::error title=Chromium de Playwright::playwright ${install[*]} falló en 3 intentos"
          exit 1
      - name: Jest con FAKE_NOW=${{ matrix.boundary }}
        env:
          FAKE_NOW: ${{ matrix.boundary }}
          TZ: UTC
        run: npx jest --ci
