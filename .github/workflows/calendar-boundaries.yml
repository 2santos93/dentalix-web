name: Fronteras de calendario

# DX-495 (TST-062): el cambio de mes del 31-10 al 01-11 dejó en rojo
# `expenses-summary-view` (DX-466) y ningún job corría el Jest con la hora en
# una frontera. Este lo corre con el reloj de jest fijado (FAKE_NOW, en
# proceso: `jest.calendar-clock.ts`), en el mes en curso, a:
#   - fin-de-mes:      el último día del mes (el 31 si lo tiene), 23:59:30 UTC;
#   - medianoche-sede: el día 1, 05:01 UTC (00:01 en una sede UTC−5);
#   - fin-de-anio:     el 31 de diciembre, 23:59:30 UTC.
# Las fechas salen de `calendarBoundary` (src/lib/test/calendar-clock.ts),
# igual que en el workflow del mismo nombre de la API. El reloj arranca en esa
# hora en cada fichero de test y avanza; los tests que fijan el suyo
# (`jest.useFakeTimers` + `setSystemTime`) no cambian.
#
# Cuándo corre: lo mismo que en la API. Lo que encuentra depende de la fecha,
# no del PR, así que no se suma a cada PR (tres runners más con `npm ci` y el
# Jest entero): corre en cada push a main, a diario, a mano y en los PR que
# tocan el propio reloj o este workflow.
on:
  push:
    branches: [main]
  pull_request:
    paths:
      - .github/workflows/calendar-boundaries.yml
      - src/lib/test/calendar-clock.ts
      - jest.calendar-clock.ts
      - jest.config.ts
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

concurrency:
  group: calendar-boundaries-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  calendar-boundaries:
    name: Fronteras de calendario (${{ matrix.boundary }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        boundary: [fin-de-mes, medianoche-sede, fin-de-anio]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - name: Jest con FAKE_NOW=${{ matrix.boundary }}
        env:
          FAKE_NOW: ${{ matrix.boundary }}
          TZ: UTC
        run: npx jest --ci
