name: E2E

# Suite Playwright de la web contra la API real (DX-070). Cada fase la corre
# `scripts/e2e-ci.sh`, el mismo script que se usa en local para reproducir la
# CI paso a paso (ver la cabecera del script).
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      api_ref:
        description: Rama, tag o commit de dentalix-api contra el que probar
        required: false
        default: main
      # DX-413: para repetir un test (p. ej. 10 veces seguidas) sin la suite
      # entera. Opcionales: sin ellos, la suite completa de siempre.
      grep:
        description: Filtro de Playwright (--grep) para correr solo los tests que lo cumplan
        required: false
        default: ''
      repeat_each:
        description: Veces que se repite cada test (--repeat-each, entero; 1 = una)
        required: false
        default: '1'

# En una rama o un PR, un push nuevo cancela la ejecución anterior. En main
# no (DX-292, TST-033): cada merge tiene su E2E completa. Su grupo es propio
# de cada run, porque en un grupo compartido GitHub cancela la run que espera
# turno cuando llega otra, aunque no haya `cancel-in-progress`.
concurrency:
  group: e2e-${{ github.workflow }}-${{ github.ref == 'refs/heads/main' && github.run_id || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  playwright:
    name: Playwright (web + API + Postgres 16)
    runs-on: ubuntu-24.04
    # DX-292 (TST-033): cada paso lleva su propio tope y la suma cabe aquí.
    # Si un paso se pasa, falla ESE paso (la run queda `failure`) y el informe
    # se sube igual; si se pasara el job, GitHub la marcaría `cancelled` y el
    # rojo no se vería. Pasos: ~3 min de checkout y Node + 1 (referencias
    # compartidas con la API) + 10 + 5 + 5 + 8 + 35 + 2 + 2 + 5 = 76
    # (Playwright: ~17–20 min la suite entera).
    # DX-413: un run de repetición (repeat_each > 1, solo workflow_dispatch)
    # corre muchas veces los mismos tests y sin reintentos: tope de 4 h.
    timeout-minutes: ${{ (inputs.repeat_each != '' && inputs.repeat_each != '1') && 240 || 80 }}
    services:
      postgres:
        image: postgres:16
        env:
          # Base efímera del job: credenciales SOLO de test, sin valor fuera de él.
          POSTGRES_USER: dentalix
          POSTGRES_PASSWORD: dentalix
          POSTGRES_DB: dentalix_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dentalix -d dentalix_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Lo que lee scripts/e2e-ci.sh. Los JWT no van aquí: el script los genera
      # con `openssl rand` en cada ejecución. No se usa ningún secreto del repo.
      API_DIR: ${{ github.workspace }}/dentalix-api
      PG_HOST: localhost
      PG_PORT: '5432'
      PG_SUPERUSER: dentalix
      PG_SUPERPASS: dentalix
      E2E_DB_NAME: dentalix_test
      E2E_API_PORT: '3000'
      E2E_WEB_PORT: '3001'
      E2E_INSTALL_BROWSERS: '1'
      NEXT_TELEMETRY_DISABLED: '1'
    defaults:
      run:
        working-directory: dentalix-web
    steps:
      # Los dos repos, hermanos en el workspace: la API no queda dentro del
      # árbol de la web (el `next build` no debe ver su código).
      - uses: actions/checkout@v4
        with:
          path: dentalix-web
          persist-credentials: false

      - name: Checkout de dentalix-api
        uses: actions/checkout@v4
        with:
          repository: 2santos93/dentalix-api
          ref: ${{ inputs.api_ref || 'main' }}
          path: dentalix-api
          persist-credentials: false

      - name: Referencias compartidas con la API
        run: scripts/e2e-ci.sh sync
        timeout-minutes: 1

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            dentalix-web/package-lock.json
            dentalix-api/package-lock.json

      - name: Poppler para verificar PDFs
        run: sudo apt-get update && sudo apt-get install -y poppler-utils

      - name: Dependencias y Chromium
        timeout-minutes: 10
        run: scripts/e2e-ci.sh setup

      - name: Base de datos (rol de la app, migrate deploy y siembra)
        timeout-minutes: 5
        run: scripts/e2e-ci.sh db

      - name: API (build y start:prod)
        timeout-minutes: 5
        run: scripts/e2e-ci.sh api

      - name: Web (next build y next start)
        timeout-minutes: 8
        run: scripts/e2e-ci.sh web

      # DX-413: `grep` y `repeat_each` (solo en workflow_dispatch) se pasan a
      # Playwright únicamente si se dieron; por defecto, la suite completa. La
      # guardia de saltados/flaky de abajo no cambia: lee el informe de lo que
      # corrió, así que un run filtrado no falla por tests no ejecutados.
      # Un run filtrado o repetido va SIN reintentos (`--retries 0`): una
      # repetición que falla es un fallo, no un flaky que el reintento de CI
      # esconde, así que «10 seguidas» en verde significa 10 pasadas a la
      # primera (0 flaky y 0 fallidos en el resumen). Entran por `env`, no por
      # interpolación en el script. Con repeat_each > 1 el tope del job sube
      # (4 h; Playwright 200 min): un test de 4 min × 20 repeticiones cabe.
      - name: Playwright
        id: playwright
        timeout-minutes: ${{ (inputs.repeat_each != '' && inputs.repeat_each != '1') && 200 || 50 }}
        env:
          E2E_GREP: ${{ inputs.grep }}
          E2E_REPEAT_EACH: ${{ inputs.repeat_each }}
        run: |
          args=()
          if [[ -n "${E2E_GREP}" ]]; then
            args+=(--grep "${E2E_GREP}")
          fi
          if [[ -n "${E2E_REPEAT_EACH}" && "${E2E_REPEAT_EACH}" != "1" ]]; then
            if ! [[ "${E2E_REPEAT_EACH}" =~ ^[1-9][0-9]{0,2}$ ]]; then
              echo "::error::repeat_each debe ser un entero positivo de hasta 3 cifras"
              exit 1
            fi
            args+=(--repeat-each "${E2E_REPEAT_EACH}")
          fi
          # Filtrado o repetido: sin reintentos (ver arriba).
          if [[ ${#args[@]} -gt 0 ]]; then
            args+=(--retries 0)
          fi
          scripts/e2e-ci.sh test ${args[@]+"${args[@]}"}

      # DX-252 (TST-030): la E2E no sale verde con tests sin ejecutar. Falla,
      # nombrando cada test, si el informe tiene «skipped» fuera de la lista
      # versionada e2e/allowed-skips.json. También corre si Playwright falló,
      # para que el resumen diga qué no se llegó a ejecutar.
      # DX-292 (TST-033): nombra los flaky (rojo si hay más de 2) y deja en el
      # resumen del job el recuento y los fallidos, flaky y saltados.
      - name: Sin tests saltados fuera de e2e/allowed-skips.json ni flaky de más
        if: always() && (steps.playwright.outcome == 'success' || steps.playwright.outcome == 'failure')
        timeout-minutes: 2
        run: scripts/e2e-ci.sh skips

      - name: Parar los servidores
        if: always()
        timeout-minutes: 2
        run: scripts/e2e-ci.sh stop

      # Siempre, también en verde (el informe trae los flaky) y si un paso
      # anterior agotó su tope; con su propio margen dentro del del job.
      - name: Subir informe, trazas y logs
        if: always()
        timeout-minutes: 5
        uses: actions/upload-artifact@v4
        with:
          name: playwright-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            dentalix-web/playwright-report/
            dentalix-web/playwright-results.json
            dentalix-web/test-results/
            dentalix-web/.e2e/logs/
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 14
